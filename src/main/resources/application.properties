spring.application.name=WordGame

# ========== ACTIVE PROFILE ==========
# spring.profiles.active=${SPRING_PROFILES_ACTIVE:azure}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
app.admin.create-secret=${ADMIN_SECRET}

# ========== DATABASE CONFIGURATION (Azure PostgreSQL) ==========
# spring.datasource.url=${DB_URL}
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver


# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate Performance Optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ========== SERVER CONFIGURATION ==========
server.port=${PORT:8082}
spring.web.error.include-message=always



# ========== CONNECTION POOLING ==========
spring.datasource.hikari.maximumPoolSize=20
spring.datasource.hikari.minimumIdle=5
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ========== LOGGING ==========
logging.level.com.example.WordGame=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.cache=DEBUG

# ========== JWT CONFIGURATION ==========
app.jwt.secret=${JWT_SECRET_KEY}
app.jwt.expiration=86400000

# ========== REDIS CACHE (Azure Cache for Redis) ==========
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PRIMARY_KEY}
spring.data.redis.timeout=5000ms

# Connection pool settings
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=2


# SSL is required for Azure Redis
spring.data.redis.ssl.enabled=true

# Cache TTL (10 minutes default)
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# ========== IMAGE STORAGE CONFIGURATION ==========
app.image-storage.provider=${IMAGE_STORAGE_PROVIDER:azure}
app.image-storage.s3.region=${S3_REGION:us-east-1}
app.image-storage.s3.endpoint=${S3_ENDPOINT:}
app.image-storage.s3.bucket=${S3_BUCKET:}
app.image-storage.s3.access-key=${S3_ACCESS_KEY:}
app.image-storage.s3.secret-key=${S3_SECRET_KEY:}
app.image-storage.s3.public-url=${S3_PUBLIC_URL:}
app.image-storage.s3.force-path-style=${S3_FORCE_PATH_STYLE:false}
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=${AZURE_CONTAINER_NAME:wordgame-images}
azure.storage.cdn-endpoint=${AZURE_CDN_ENDPOINT}

# ========== EMAIL / SMTP CONFIGURATION ==========
# Configure these via environment variables in production (SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Optional from address used by the app
app.mail.from=${MAIL_FROM:no-reply@wordgame.example}
app.mail.provider=${MAIL_PROVIDER:gmail}
app.mail.host=${SMTP_HOST:}
app.mail.port=${SMTP_PORT:587}
app.mail.username=${SMTP_USERNAME:}
app.mail.password=${SMTP_PASSWORD:}



# OAuth2 credentials must be supplied through environment variables.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
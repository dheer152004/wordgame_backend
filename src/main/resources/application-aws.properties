spring.application.name=WordGame

# AWS PostgreSQL/RDS
spring.datasource.url=${database-nroq.c3ec2ye0ga06.ap-south-1.rds.amazonaws.com}
spring.datasource.username=${postgres}
spring.datasource.password=${Sachinkk2004}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

# AWS region and S3 media bucket. Use IAM role credentials in Lambda/ECS/EC2.
app.image-storage.provider=s3
app.image-storage.s3.region=${AWS_REGION:us-east-1}
app.image-storage.s3.bucket=${S3_BUCKET}
app.image-storage.s3.public-url=${CLOUDFRONT_URL}
app.image-storage.s3.endpoint=${S3_ENDPOINT:}
app.image-storage.s3.force-path-style=false

# AWS SES
app.mail.provider=ses
app.mail.from=${MAIL_FROM}
app.mail.ses.region=${AWS_REGION:us-east-1}

# Configure these only when Google OAuth is enabled in the deployment.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

server.port=${PORT:8080}